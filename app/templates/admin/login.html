{% extends "base.html" %}
{% block title %}관리자 로그인{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1 class="page-title">🔐 관리자 로그인</h1>
  <p class="muted">.env 의 <code>ADMIN_PASSWORD</code> 값을 입력하세요.</p>
  <form method="post" class="form">
    {{ form.hidden_tag() }}
    <label class="field">
      <span>{{ form.password.label.text }}</span>
      {{ form.password(autofocus=true, autocomplete="current-password") }}
      {% for e in form.password.errors %}<em class="err">{{ e }}</em>{% endfor %}
    </label>
    <button class="btn primary" type="submit">로그인</button>
  </form>
</div>
{% endblock %}
